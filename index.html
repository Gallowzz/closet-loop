    /* ---------- Tokens de marca (nombres del brief) ---------- */
    :root {

      --ease-out-expo: cubic-bezier(.22, 1, .36, 1);

    html { scroll-behavior: smooth; }
    html, body { overflow-x: clip; }

    :focus-visible { outline: 3px solid var(--color-lime); outline-offset: 2px; border-radius: 4px; }

    body::after {

    .dots-ivory { background-image: radial-gradient(rgba(255,255,255,.45) 1.2px, transparent 1.2px); background-size: 20px 20px; }

    /* Marquesina + sticker giratorio */
    @keyframes marquee { to { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 28s linear infinite; }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    @keyframes sticker { to { transform: rotate(360deg); } }
    .sticker-spin { animation: sticker 16s linear infinite; }

    /* Transiciones Vue */
    .menu-enter-active, .menu-leave-active { transition: opacity .25s ease, transform .25s ease; }
    .menu-enter-from, .menu-leave-to { opacity: 0; transform: translateY(-10px); }
    .fade-enter-active, .fade-leave-active { transition: opacity .18s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    .swap-enter-active, .swap-leave-active { transition: opacity .3s ease, transform .3s ease; }
    .swap-enter-from { opacity: 0; transform: scale(.9) translateY(8px); }
    .swap-leave-to { opacity: 0; transform: scale(.92); }
    .cards-move, .cards-enter-active, .cards-leave-active { transition: all .4s var(--ease-out-expo); }
    .cards-enter-from, .cards-leave-to { opacity: 0; transform: scale(.9) translateY(10px); }
    .cards-leave-active { position: absolute; }
    .look-move, .look-enter-active, .look-leave-active { transition: all .3s var(--ease-out-expo); }
    .look-enter-from, .look-leave-to { opacity: 0; transform: translateX(10px); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .marquee-track, .sticker-spin, .animate-spin { animation: none !important; }

        const saved = ref(false);
        let maxT, saveT;

          (activeCat.value === 'todo' || g.cat === activeCat.value) &&
          g.name.toLowerCase().includes(query.value.trim().toLowerCase())

        });

          maxHint.value = false;

        const email = ref('');
        const state = ref('idle'); // idle | loading | success
        const error = ref('');

        async function submit() {
          if (state.value === 'loading') return;
          error.value = '';
          const v = email.value.trim();
          if (!v) { error.value = 'Escribe tu correo para unirte al loop.'; return; }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { error.value = 'Ese correo no parece válido. Revísalo.'; return; }
          state.value = 'loading';
          try {
            const res = await joinWaitlist(v);
            if (res && res.ok) state.value = 'success';
            else { state.value = 'idle'; error.value = 'No se ha podido registrar. Inténtalo de nuevo.'; }
          } catch (e) {
            state.value = 'idle';
            error.value = 'No se ha podido registrar. Inténtalo de nuevo.';
          }
        }
        function reset() { state.value = 'idle'; email.value = ''; error.value = ''; }

        return { email, state, error, submit, reset };
      },
      template: `
        <div>
          <form v-if="state !== 'success'" novalidate class="mx-auto max-w-xl text-left" @submit.prevent="submit">
            <label for="wl-email" class="font-mono text-[0.64rem] font-bold tracking-[0.22em] text-lime">TU CORREO ELECTRÓNICO</label>
            <div class="mt-3 flex flex-col gap-3 sm:flex-row">
              <input id="wl-email" v-model.trim="email" @input="error = ''" type="email" name="email" autocomplete="email"
                     placeholder="Tu correo electrónico"
                     :aria-invalid="error ? 'true' : 'false'" :aria-describedby="error ? 'wl-error' : 'wl-hint'"
                     class="h-14 w-full flex-1 rounded-xl border-2 bg-ivory px-5 text-base font-medium text-midnight outline-none transition placeholder:text-midnight/40"
                     :class="error ? 'border-lime' : 'border-transparent'">
              <button type="submit" :disabled="state === 'loading'"
                      class="inline-flex h-14 items-center justify-center gap-2 whitespace-nowrap rounded-xl bg-lime px-7 text-sm font-bold text-midnight transition hover:bg-ivory disabled:cursor-wait disabled:opacity-80">
                <span v-if="state === 'loading'" class="h-4 w-4 animate-spin rounded-full border-2 border-midnight/30 border-t-midnight" aria-hidden="true"></span>
                {{ state === 'loading' ? 'Enviando…' : 'Quiero estar en la lista' }}
                <ui-icon v-if="state !== 'loading'" name="arrow-right" class="h-4 w-4" />
              </button>
            </div>
            <p id="wl-hint" class="mt-3 text-sm text-ivory/70">
              Entérate del lanzamiento y sé de las primeras personas en conocer Closet Loop.
            </p>
            <p v-if="error" id="wl-error" class="mt-2 flex items-center gap-2 text-sm font-medium text-lime" aria-live="polite">
              <ui-icon name="info" class="h-4 w-4 shrink-0" />{{ error }}
            </p>
            <p class="mt-5 font-mono text-[0.58rem] tracking-[0.14em] text-ivory/40">SIN SPAM — SOLO TE ESCRIBIREMOS PARA EL LANZAMIENTO</p>
          </form>

          <div v-else role="status" class="mx-auto max-w-xl rounded-2xl border border-lime/40 bg-ivory/5 p-8 text-center">
            <ui-icon name="circle-check" class="mx-auto h-11 w-11 text-lime" />
            <h3 class="mt-4 text-2xl font-bold text-ivory">¡Estás dentro del loop!</h3>
            <p class="mt-3 text-sm leading-relaxed text-ivory/70">
              Esta es una demo sin servidor: tu correo no se ha enviado a ningún sitio y no lo guardamos.
            </p>
            <p class="mt-4 font-mono text-[0.58rem] tracking-[0.16em] text-lime/90">CONECTA AQUÍ TU PROVEEDOR DE LISTAS CUANDO LANCEMOS</p>
            <button type="button" @click="reset" class="mt-5 text-sm font-semibold text-ivory/80 underline underline-offset-4 transition hover:text-ivory">
              Añadir otro correo
            </button>
          </div>
        </div>`,
    };

    const WaitlistSection = {
      template: `
        <section id="lista-espera" class="relative scroll-mt-24 overflow-hidden bg-midnight py-28 text-ivory lg:py-36" aria-labelledby="waitlist-title">
          <svg viewBox="0 0 120 100" class="absolute -bottom-28 -left-20 h-[460px] w-auto rotate-[-8deg] text-ivory opacity-[0.06]" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 32C60 25 65 24 67 19 69.5 12.5 63 6.5 57 8.5 51.5 10.5 50.5 17 55 20" />
              <path d="M60 32 14 62M60 32 106 62M14 62h56" />
            </g>
            <path d="M69 50.5 91 62 69 73.5Z" fill="currentColor" />
            <path d="M99 62h7" stroke="currentColor" stroke-width="8" stroke-linecap="round" />
          </svg>
          <div class="dots-ivory absolute left-8 top-10 h-48 w-64 opacity-10 [mask-image:radial-gradient(70%_70%_at_50%_50%,black,transparent)]" aria-hidden="true"></div>
          <svg viewBox="0 0 100 100" class="absolute right-10 top-12 hidden h-14 w-14 opacity-90 lg:block" aria-hidden="true">
            <path d="M50 2C56 36 64 44 98 50 64 56 56 64 50 98 44 64 36 56 2 50 36 44 44 36 50 2Z" fill="url(#gradChrome)" />
          </svg>

          <div class="relative mx-auto max-w-2xl px-5 text-center lg:px-8">
            <p v-reveal class="inline-flex items-center gap-2.5 font-mono text-[0.7rem] font-bold uppercase tracking-[0.26em] text-lime">
              <span class="inline-block h-2 w-2 rotate-45 bg-lime"></span>EL PRIMER LOOP
            </p>
            <h2 id="waitlist-title" v-reveal="{ delay: 0.08 }" class="mt-6 text-[clamp(2.2rem,5.5vw,4rem)] font-bold leading-[1.02] tracking-tight">
              Tu próximo look <em class="font-serif font-medium italic text-lime">empieza aquí</em>.
            </h2>
            <p v-reveal="{ delay: 0.16 }" class="mx-auto mt-6 max-w-lg text-lavender lg:text-lg">
              Estamos preparando una nueva forma de descubrir, combinar y compartir moda. ¿Te unes al primer loop?
            </p>
            <div v-reveal="{ delay: 0.24 }" class="mt-10">
              <waitlist-form />
            </div>
          </div>
        </section>`,
    };

    /* =========================================================
       APP RAÍZ
       ========================================================= */

    const App = {
      template: `
        <site-header />
        <main id="contenido">
          <hero-section />
          <ticker-strip />
          <closet-section />
          <styling-section />
          <marketplace-section />
          <waitlist-section />
        </main>
        <site-footer />`,
    };

    const app = createApp(App);

    /* Directiva v-reveal: aparición al hacer scroll con Motion,
       desactivada si el usuario prefiere movimiento reducido o si Motion no carga. */
    app.directive('reveal', {
      mounted(el, binding) {
        const o = binding.value || {};
        if (reducedMotion || !M || typeof M.animate !== 'function' || typeof M.inView !== 'function') return;
        const y = o.y ?? 26;
        const delay = o.delay ?? 0;
        el.style.opacity = '0';
        let stop;
        stop = M.inView(el, () => {
          if (el.__revealed) return;
          el.__revealed = true;
          if (stop) { try { stop(); } catch (e) { /* noop */ } }
          M.animate(el, { opacity: [0, 1], y: [y, 0] }, { duration: o.duration ?? 0.8, delay, ease: [0.22, 1, 0.36, 1] });
        }, { margin: '0px 0px -12% 0px' });
      },
    });

    app.component('ui-icon', UiIcon);
    app.component('brand-logo', BrandLogo);
    app.component('section-eyebrow', SectionEyebrow);
    app.component('garment-art', GarmentArt);
    app.component('garment-card', GarmentCard);
    app.component('editorial-image', EditorialImage);
    app.component('site-header', SiteHeader);
    app.component('site-footer', SiteFooter);
    app.component('hero-section', HeroSection);
    app.component('ticker-strip', TickerStrip);
    app.component('closet-section', ClosetSection);
    app.component('styling-section', StylingSection);
    app.component('marketplace-section', MarketplaceSection);
    app.component('waitlist-form', WaitlistForm);
    app.component('waitlist-section', WaitlistSection);

    app.mount('#app');
  </script>
</body>
</html>
